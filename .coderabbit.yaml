# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  enable_prompt_for_ai_agents: true
  path_filters:
    - "!**/build/**"
    - "!**/.gradle/**"
    - "!**/*.webp"
    - "!**/*.png"
  auto_review:
    enabled: true
    drafts: true
    auto_incremental_review: true
    ignore_title_keywords:
      - "WIP"
      - "[skip review]"
    labels:
      - "!do-not-review"
    ignore_usernames:
      - "dependabot[bot]"
      - "github-actions[bot]"
  path_instructions:
    - path: "app/src/main/**/*.kt"
      instructions: |
        - Treat this as a completely offline-first personal finance app. Flag new runtime network dependencies, remote data requirements, analytics, or functionality that fails without internet.
        - Flag user-visible uses of "Akshar". Existing package names, namespaces, application IDs, and source paths containing com.akshar are technical identifiers and must not be renamed merely for this rule.
        - Check money calculations for floating-point errors, incorrect signs, invalid zero or negative values, overflow, and locale-sensitive parsing or formatting.
        - Check coroutines, Flow collection, and Room operations for lifecycle leaks, blocking work on the main thread, lost updates, and race conditions.
        - Preserve accessibility, reduced-motion behavior, stable Compose state, and graceful shader fallbacks on unsupported Android versions or GPU hardware.
    - path: "app/src/main/java/com/akshar/ui/**"
      instructions: |
        - Review Compose code for unnecessary recomposition, unstable parameters, state created without remember, clipped content, inaccessible controls, and animation work that continues while off-screen.
        - Shader and visual effects must remain decorative: core actions, navigation, contrast, and readable financial values must work when effects are disabled or unavailable.
    - path: "**/*Test.kt"
      instructions: |
        - Require deterministic tests for changed financial logic, persistence, restore/import behavior, and important ViewModel state transitions.
        - Flag tests that depend on network access, wall-clock timing, execution order, or developer-specific files.
    - path: "**/*.gradle.kts"
      instructions: |
        - Flag unpinned repositories, secret material, developer-specific paths, release-signing regressions, and dependencies that add unnecessary online behavior.

chat:
  auto_reply: true
